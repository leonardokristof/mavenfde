<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fibery</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 44rem;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      .log {
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 1rem;
        min-height: 20rem;
        margin-bottom: 1rem;
        white-space: pre-wrap;
        overflow-y: auto;
      }
      .turn { margin-bottom: 1rem; }
      .who { font-weight: 600; }
      form { display: flex; gap: 0.5rem; }
      input { flex: 1; padding: 0.5rem; font: inherit; }
      button { padding: 0.5rem 1rem; font: inherit; }
      h2 { margin-top: 3rem; }
    </style>
  </head>
  <body>
    <h1>Fibery</h1>
    <p>
      Upiši adresu, ADM ID ili WWMS broj. Odgovor kaže je li optika dostupna, je li
      aktivna HAKOM štoperica, što je s otvorenim zahtjevom i kome se javiti.
    </p>

    <div class="log" id="fibre-log"></div>
    <form id="fibre-form">
      <input id="fibre-input" placeholder="npr. provjeri adresu Vrbik 23 Zagreb" autocomplete="off" />
      <button type="submit">Send</button>
    </form>

    <h2>General chat</h2>

    <div class="log" id="chat-log"></div>
    <form id="chat-form">
      <input id="chat-input" placeholder="Ask something..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>

    <script type="module">
      const OUTCOMES = {
        answered: "odgovor",
        needs_clarification: "treba pojašnjenje",
        not_found: "nije u sustavu",
        out_of_scope: "izvan teme",
        error: "greška",
      };

      function addTurn(log, who, text) {
        const div = document.createElement("div");
        div.className = "turn";
        div.innerHTML = `<span class="who">${who}:</span> `;
        const span = document.createElement("span");
        div.appendChild(span);
        span.textContent = text;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
        return span;
      }

      // NOTE: this loads the Gradio client from a public CDN. On a locked-down
      // corporate network that request may simply fail, so say it out loud
      // instead of leaving a page that looks fine and does nothing.
      let client;
      try {
        const { Client } = await import("https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js");
        client = await Client.connect(window.location.origin);
      } catch (err) {
        console.error(err);
        addTurn(document.getElementById("fibre-log"), "Fibery",
          "Ne mogu učitati Gradio klijent s cdn.jsdelivr.net. Ako je mreža blokira, stranica se učita, ali ne može slati pitanja.");
      }

      // Fibery. The model has no memory: this array is the whole conversation.
      const fibreLog = document.getElementById("fibre-log");
      const fibreInput = document.getElementById("fibre-input");
      const fibreHistory = [];

      document.getElementById("fibre-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = fibreInput.value.trim();
        if (!message || !client) return;
        fibreInput.value = "";

        addTurn(fibreLog, "You", message);
        const out = addTurn(fibreLog, "Fibery", "provjeravam...");
        try {
          const result = await client.predict("/answer_fibre_question", { message, history: fibreHistory });
          const response = JSON.parse(result.data[0]);
          out.parentElement.querySelector(".who").textContent = `Fibery (${OUTCOMES[response.outcome] ?? response.outcome}):`;
          out.textContent = response.answer;
          fibreHistory.push({ role: "user", content: message });
          fibreHistory.push({ role: "assistant", content: response.answer });
        } catch (err) {
          out.textContent = `Zahtjev nije prošao: ${err.message ?? err}`;
        }
        fibreLog.scrollTop = fibreLog.scrollHeight;
      });

      // The general chat, as it was.
      const chatLog = document.getElementById("chat-log");
      const chatInput = document.getElementById("chat-input");
      const chatHistory = [];

      document.getElementById("chat-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = chatInput.value.trim();
        if (!message || !client) return;
        chatInput.value = "";

        addTurn(chatLog, "You", message);
        const out = addTurn(chatLog, "Assistant", "");

        // submit() streams; each event carries the reply so far.
        let reply = "";
        const job = client.submit("/chat", { message, history: chatHistory });
        for await (const event of job) {
          if (event.type === "data") {
            reply = event.data[0];
            out.textContent = reply;
            chatLog.scrollTop = chatLog.scrollHeight;
          }
        }

        chatHistory.push({ role: "user", content: message });
        chatHistory.push({ role: "assistant", content: reply });
      });
    </script>
  </body>
</html>
